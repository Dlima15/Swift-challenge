<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift - Dashboard Gamificado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css"> 
</head>
<body>

<div class="dashboard-container">
    <nav class="navbar header-swift">
        <div class="container-fluid">
            <button class="menu-toggler"><i class="fas fa-bars"></i></button>
            <span class="navbar-brand-swift">Swift</span>
            <div class="nav-icons">
                <i class="fas fa-search nav-icon"></i>
                <i class="fas fa-cog nav-icon animated-icon"></i>
                <i class="fas fa-bell nav-icon animated-icon"></i>
            </div>
        </div>
    </nav>

    <div class="main-content container-fluid p-0">
        <div class="row g-0">
            <div class="col-lg-4 d-none d-lg-block">
                <div class="image-section">
                    </div>
            </div>

            <div class="col-12 col-lg-8 dashboard-area p-4 p-md-5">
                <div class="row g-4">
                    <div class="col-12 col-md-6 order-md-1">
                        <div class="card-swift profile-card animated-in">
                            <div class="d-flex align-items-center mb-3">
                                <i class="fas fa-user-circle profile-icon"></i>
                                <div>
                                    <h5 class="mb-0">Diego Matias</h5>
                                    <small class="text-muted">3530 / 25000 XP</small>
                                </div>
                                <span class="badge-swift ms-auto" title="Nível Ouro">
                                    <i class="fas fa-medal"></i>
                                </span>
                            </div>
                            <div class="progress-bar-swift">
                                <div class="progress-fill" style="width: 14.12%;" data-xp="3530/25000"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-6 order-md-3 order-lg-2">
                        <div class="card-swift feedback-card animated-in delay-1">
                            <div class="d-flex align-items-center mb-2">
                                <i class="fas fa-user-circle profile-icon"></i>
                                <h5 class="mb-0">Cliente Aline</h5>
                            </div>
                            <p class="mb-2">Atendimento ótimo e atencioso!</p>
                            <div class="stars">
                                <i class="fas fa-star filled"></i>
                                <i class="fas fa-star filled"></i>
                                <i class="fas fa-star filled"></i>
                                <i class="fas fa-star filled"></i>
                                <i class="fas fa-star"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-12 col-lg-6 order-lg-3">
                        <div class="row g-4">
                            <div class="col-12">
                                <div class="task-card daily-task animated-in delay-2">
                                    <small>Diária</small>
                                    <span class="xp-reward">+ 500 XP</span>
                                    <p class="task-title">Faça 3 vendas</p>
                                    <div class="progress-bar-task">
                                        <div class="progress-fill" style="width: 0%;" data-current="0" data-total="3"></div>
                                        <span class="progress-text">0/3</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="task-card weekly-task animated-in delay-3">
                                    <small>Semanal</small>
                                    <span class="xp-reward">+ 800 XP</span>
                                    <p class="task-title">Receba 5 avaliações 5<i class="fas fa-star"></i></p>
                                    <div class="progress-bar-task">
                                        <div class="progress-fill" style="width: 40%;" data-current="2" data-total="5"></div>
                                        <span class="progress-text">2/5</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="task-card monthly-task animated-in delay-4">
                                    <small>Mensal</small>
                                    <span class="xp-reward">+ 1000 XP</span>
                                    <p class="task-title">Faça 100 vendas</p>
                                    <div class="progress-bar-task">
                                        <div class="progress-fill" style="width: 50%;" data-current="50" data-total="100"></div>
                                        <span class="progress-text">50/100</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-12 col-md-6 order-md-2 order-lg-4">
                        <div class="row g-3 icon-grid animated-in delay-5">
                            <div class="col-4 icon-wrapper"><div class="icon-circle clickable-icon" data-text="Ranking"><i class="fas fa-thumbs-up"></i></div></div>
                            <div class="col-4 icon-wrapper"><div class="icon-circle clickable-icon" data-text="Liderança"><i class="fas fa-users"></i></div></div>
                            <div class="col-4 icon-wrapper"><div class="icon-circle clickable-icon" data-text="Agenda"><i class="fas fa-calendar-alt"></i></div></div>
                            <div class="col-4 icon-wrapper"><div class="icon-circle clickable-icon" data-text="Finanças"><i class="fas fa-dollar-sign"></i></div></div>
                            <div class="col-4 icon-wrapper"><div class="icon-circle clickable-icon" data-text="Metas"><i class="fas fa-clipboard-check"></i></div></div>
                            <div class="col-4 icon-wrapper"><div class="icon-circle clickable-icon" data-text="Loja de Recompensas"><i class="fas fa-store"></i></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/inicial.js"></script>

</body>
</html>
