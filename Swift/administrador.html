<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles/administrador.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient p-3">
        <div class="container-fluid">
            <div>
                <button class="btn text-white me-2"><i class="bi bi-list" style="font-size: 1.5rem;"></i></button>
                <a class="navbar-brand fw-bold" href="#"><img src="imgs/Vector-branco.png" alt="Swift" width="80"></a>
            </div>
            <div class="d-flex">
                <button class="btn text-white"><i class="bi bi-bell" style="font-size: 1.2rem;"></i></button>
                <button class="btn text-white"><i class="bi bi-gear" style="font-size: 1.2rem;"></i></button>
            </div>
        </div>
    </nav>
  <!-- Container principal -->
  <div class="main-container">
    
    <!-- Imagem lateral -->
    <div class="image-left d-none d-md-block">
      <img src="./imgs/Filet Mignon Recipe 1.png" alt="Carne">
    </div>

    <!-- Conteúdo central -->
    <div class="content-center">
      <div class="icons">
        <div class="icon-circle"><i class="bi bi-hand-thumbs-up"></i></div>
        <div class="icon-circle"><i class="bi bi-people"></i></div>
        <div class="icon-circle"><i class="bi bi-calendar-event"></i></div>
        <div class="icon-circle"><i class="bi bi-clipboard-check"></i></div>
        <div class="icon-circle"><i class="bi bi-shop"></i></div>
      </div>
    </div>

    <!-- Botões laterais -->
    <div class="buttons-right">
      <button class="btn btn-custom">Relatórios</button>
      <button class="btn btn-custom">Gráficos</button>
      <button class="btn btn-custom">Fichas</button>
    </div>

  </div>
</body>
</html>
