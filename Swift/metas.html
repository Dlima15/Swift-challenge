<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missões Swift</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/metas.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-gradient p-3">
    <div class="container-fluid">
      <button class="btn text-white me-2"><i class="bi bi-list" style="font-size: 1.5rem;"></i></button>
      <a class="navbar-brand fw-bold" href="#"><img src="./imgs/Vector-branco.png" alt="Swift" width="80"></a>
      
      <div class="progress flex-grow-1 mx-5 border" style="height: 18px;">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-danger" style="width: 15%;">
          3530 / 25000 XP
        </div>
      </div>

      <div class="d-flex">
        <button class="btn text-white"><i class="bi bi-bell" style="font-size: 1.2rem;"></i></button>
        <button class="btn text-white"><i class="bi bi-gear" style="font-size: 1.2rem;"></i></button>
      </div>
    </div>
  </nav>

  <!-- Conteúdo -->
  <div class="container mt-2 bg-white p-4 rounded-5">
    <!-- Missão -->
    <div class="mission-box d-flex justify-content-between align-items-center">
      <div class="w-75">
        <h6>Faça 3 vendas</h6>
        <div class="progress">
          <div class="progress-bar bg-danger" style="width: 0%">0/3</div>
        </div>
      </div>
      <div class="text-end">
        <span class="fw-bold">+ 500 XP</span><br>
        <button class="btn btn-light btn-sm mt-1" disabled>Resgatar</button>
      </div>
    </div>

    <div class="mission-box d-flex justify-content-between align-items-center">
      <div class="w-75">
        <h6>Receba 5 avaliações de 5 estrelas</h6>
        <div class="progress">
          <div class="progress-bar bg-danger" style="width: 40%">2/5</div>
        </div>
      </div>
      <div class="text-end">
        <span class="fw-bold">+ 800 XP</span><br>
        <button class="btn btn-light btn-sm mt-1" disabled>Resgatar</button>
      </div>
    </div>

    <div class="mission-box d-flex justify-content-between align-items-center">
      <div class="w-75">
        <h6>Vender 4 sopas congeladas</h6>
        <div class="progress">
          <div class="progress-bar bg-danger" style="width: 100%">4/4</div>
        </div>
      </div>
      <div class="text-end">
        <span class="fw-bold">+ 600 XP</span><br>
        <button class="btn btn-outline-danger btn-sm mt-1">Resgatar</button>
      </div>
    </div>

    <div class="mission-box d-flex justify-content-between align-items-center">
      <div class="w-75">
        <h6>Fazer 100 vendas</h6>
        <div class="progress">
          <div class="progress-bar bg-danger" style="width: 50%">50/100</div>
        </div>
      </div>
      <div class="text-end">
        <span class="fw-bold">+ 1000 XP</span><br>
        <button class="btn btn-light btn-sm mt-1" disabled>Resgatar</button>
      </div>
    </div>

    <div class="mission-box d-flex justify-content-between align-items-center">
      <div class="w-75">
        <h6>Receba 50 avaliações</h6>
        <div class="progress">
          <div class="progress-bar bg-danger" style="width: 20%">10/50</div>
        </div>
      </div>
      <div class="text-end">
        <span class="fw-bold">+ 500 XP</span><br>
        <button class="btn btn-light btn-sm mt-1" disabled>Resgatar</button>
      </div>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
