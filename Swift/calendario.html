<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift - Agenda Gamificada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/calendario.css"> 
</head>
<body>

<div class="agenda-container">
    <nav class="navbar header-swift">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <button class="menu-toggler"><i class="fas fa-bars"></i></button>
                <span class="navbar-brand-swift">Swift</span>
            </div>
            
            <div class="xp-bar-header d-none d-sm-flex align-items-center mx-3 animated-in">
                <small class="text-white me-2">3530 / 25000 XP</small>
                <div class="progress-bar-swift">
                    <div class="progress-fill" style="width: 14.12%;"></div>
                </div>
                <span class="badge-swift ms-3" title="Nível Ouro"><i class="fas fa-medal"></i></span>
            </div>

            <div class="nav-icons">
                <i class="fas fa-bell nav-icon animated-icon"></i>
                <i class="fas fa-cog nav-icon animated-icon ms-3"></i>
            </div>
        </div>
    </nav>

    <div class="main-content container-fluid p-0">
        <div class="row g-0">
            <div class="col-lg-4 d-none d-lg-block">
                <div class="image-section">
                    </div>
            </div>

            <div class="col-12 col-lg-8 agenda-area p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4 animated-in">
                    <h3 class="agenda-title">Maio de 2025 <i class="fas fa-caret-down"></i></h3>
                    <i class="fas fa-search search-icon"></i>
                </div>

                <div class="row g-4">
                    <div class="col-12 col-xl-6 order-xl-1">
                        <div class="days-header mb-3 animated-in delay-1">
                            <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                        </div>
                        
                        <div class="month-grid animated-in delay-2">
                            <div class="date-box empty"></div><div class="date-box empty"></div><div class="date-box empty"></div><div class="date-box empty"></div>
                            <div class="date-box date-item">1</div>
                            <div class="date-box date-item">2</div>
                            <div class="date-box date-item">3</div>
                            <div class="date-box date-item">4</div><div class="date-box date-item">5</div><div class="date-box date-item">6</div>
                            <div class="date-box date-item">7</div><div class="date-box date-item">8</div><div class="date-box date-item">9</div>
                            <div class="date-box date-item">10</div>
                            <div class="date-box date-item">11</div><div class="date-box date-item">12</div><div class="date-box date-item">13</div>
                            <div class="date-box date-item">14</div><div class="date-box date-item">15</div><div class="date-box date-item">16</div>
                            <div class="date-box date-item selected-date" data-day="Sábado">17</div>
                            <div class="date-box date-item">18</div><div class="date-box date-item">19</div><div class="date-box date-item">20</div>
                            <div class="date-box date-item">21</div><div class="date-box date-item">22</div><div class="date-box date-item">23</div>
                            <div class="date-box date-item">24</div>
                            <div class="date-box date-item">25</div><div class="date-box date-item">26</div><div class="date-box date-item">27</div>
                            <div class="date-box date-item">28</div><div class="date-box date-item">29</div><div class="date-box date-item">30</div>
                            <div class="date-box date-item">31</div>
                        </div>

                        <div class="month-nav mt-4 animated-in delay-3">
                            <span class="month-tag">Jan</span><span class="month-tag">Fev</span><span class="month-tag">Mar</span>
                            <span class="month-tag">Abr</span><span class="month-tag active-month">Mai</span><span class="month-tag">Jun</span>
                            <span class="month-tag">Jul</span><span class="month-tag">Ago</span><span class="month-tag">Set</span>
                            <span class="month-tag">Out</span><span class="month-tag">Nov</span><span class="month-tag">Dez</span>
                        </div>
                    </div>

                    <div class="col-12 col-xl-6 order-xl-2">
                        <div class="time-slots-card animated-in delay-4">
                            <div class="date-indicator">17 <span class="day-name">sábado</span></div>
                            <div class="time-slots-list">
                                <div class="time-slot-item">01:00</div>
                                <div class="time-slot-item">02:00</div>
                                <div class="time-slot-item">03:00</div>
                                <div class="time-slot-item">04:00</div>
                                <div class="time-slot-item">05:00</div>
                                <div class="time-slot-item">06:00</div>
                                <div class="time-slot-item">07:00</div>
                                <div class="time-slot-item">08:00</div>
                                <div class="time-slot-item">09:00</div>
                                </div>
                            <div class="time-slot-highlight"></div>
                        </div>
                        <button class="btn-add-event animated-in delay-5" title="Adicionar Evento">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/calendario.js"></script>

</body>
</html>
